<title id="title">Arquitectura de RaceStream Lab</title>
<desc id="desc">El simulador publica eventos en Kafka. El consumer mantiene proyecciones en PostgreSQL y publica eventos derivados. La API entrega actualizaciones al panel; Spark archiva y analiza los datos en MinIO.</desc>
