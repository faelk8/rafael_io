<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc" lang="es-ES">
<title id="title">Arquitectura de centralización de datos con Kafka</title>
<desc id="desc">Las bases de los clientes envían datos mediante Debezium a Kafka. El flujo se distribuye hacia S3, PostgreSQL y análisis con Python y KSQL. Airflow automatiza el mantenimiento de las conexiones. Promtail, Loki y Grafana apoyan la monitorización.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#80baff" /></marker></defs>
<rect width="1200" height="820" rx="20" fill="#10141c" />
<g font-family="Arial, sans-serif">
<text x="48" y="55" fill="#edf2fa" font-size="28" font-weight="700">Arquitectura de datos · Apache Kafka</text>
<rect x="48" y="155" width="280" height="140" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="68" y="188" fill="#80baff" font-size="20" font-weight="700">Bases de los clientes</text>
<text x="68" y="218" fill="#edf2fa" font-size="16">≈ 1.400 → 1.800 bases</text>
<text x="68" y="242" fill="#edf2fa" font-size="16">27 tablas por base</text>
<text x="68" y="266" fill="#edf2fa" font-size="16">Identificación de origen</text>
<rect x="400" y="155" width="280" height="140" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="420" y="188" fill="#80baff" font-size="20" font-weight="700">Debezium</text>
<text x="420" y="218" fill="#edf2fa" font-size="16">9 instancias</text>
<text x="420" y="242" fill="#edf2fa" font-size="16">Recogida distribuida</text>
<text x="420" y="266" fill="#edf2fa" font-size="16">Configuración por conexión</text>
<rect x="752" y="155" width="400" height="140" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="772" y="188" fill="#80baff" font-size="20" font-weight="700">Clúster Kafka</text>
<text x="772" y="218" fill="#edf2fa" font-size="16">3 instancias Amazon EC2</text>
<text x="772" y="242" fill="#edf2fa" font-size="16">Temas por tabla · retención de 7 días</text>
<text x="772" y="266" fill="#edf2fa" font-size="16">≈ 45 GB/día · operación 24/7</text>
<path d="M328 225H400" fill="none" stroke="#80baff" stroke-width="2" marker-end="url(#arrow)" />
<path d="M680 225H752" fill="none" stroke="#80baff" stroke-width="2" marker-end="url(#arrow)" />
<rect x="48" y="355" width="632" height="130" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="68" y="388" fill="#80baff" font-size="20" font-weight="700">Apache Airflow</text>
<text x="68" y="418" fill="#edf2fa" font-size="16">Alta de bases y retirada de conexiones en desuso</text>
<text x="68" y="442" fill="#edf2fa" font-size="16">Verificación, corrección e interrupción de conexiones</text>
<path d="M540 355V295" fill="none" stroke="#80baff" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)" />
<rect x="48" y="560" width="280" height="115" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="68" y="593" fill="#80baff" font-size="20" font-weight="700">Amazon S3</text>
<text x="68" y="623" fill="#edf2fa" font-size="16">Archivos Parquet</text>
<text x="68" y="647" fill="#edf2fa" font-size="16">Granularidad diaria</text>
<rect x="400" y="560" width="280" height="115" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="420" y="593" fill="#80baff" font-size="20" font-weight="700">PostgreSQL</text>
<text x="420" y="623" fill="#edf2fa" font-size="16">Datos para otros</text>
<text x="420" y="647" fill="#edf2fa" font-size="16">consumidores</text>
<rect x="752" y="560" width="400" height="115" rx="12" fill="#18283d" stroke="#476e9e" />
<text x="772" y="593" fill="#80baff" font-size="20" font-weight="700">Python + KSQL</text>
<text x="772" y="623" fill="#edf2fa" font-size="16">Consultas y análisis en tiempo real</text>
<text x="772" y="647" fill="#edf2fa" font-size="16">Pagos, pedidos y accesos</text>
