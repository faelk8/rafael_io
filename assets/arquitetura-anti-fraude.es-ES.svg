<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="es-ES">
<title id="title">Arquitectura del sistema de detección de fraude</title>
<desc id="desc">Los datos de PostgreSQL y MongoDB se tratan y almacenan en ClickHouse. El sistema consume pedidos de RabbitMQ y utiliza análisis estadísticos y datos históricos para enviarlos a las colas de aprobados o rechazados.</desc>
