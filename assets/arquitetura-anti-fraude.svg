<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura do sistema de detecção de fraude</title>
<desc id="desc">Dados de PostgreSQL e MongoDB são tratados e armazenados no ClickHouse. O sistema consome pedidos do RabbitMQ e usa análises estatísticas e dados históricos para encaminhar pedidos às filas de aprovados ou reprovados.</desc>
