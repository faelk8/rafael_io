<title id="title">Fraud detection system architecture</title>
<desc id="desc">PostgreSQL and MongoDB data is processed and stored in ClickHouse. The system consumes orders from RabbitMQ and uses statistical analysis and historical data to route orders to approved or rejected queues.</desc>
